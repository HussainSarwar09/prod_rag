[project]
name = "production-rag"
version = "0.1.0"
description = "A RAG project that closely mimics the production ecosystem."
authors = [
    {name = "Hussain",email = "mohammed.sarwarhussain@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi (>=0.139.0,<0.140.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "langgraph (>=1.2.8,<2.0.0)",
    "langchain (>=1.3.12,<2.0.0)",
    "langchain-core (>=1.4.9,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langsmith (>=0.10.0,<0.11.0)",
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "orjson (>=3.11.9,<4.0.0)",
    "pymupdf (>=1.28.0,<2.0.0)",
    "python-multipart (>=0.0.32,<0.0.33)",
]

[tool.poetry]
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "ruff (>=0.15.20,<0.16.0)",
    "mypy (>=2.2.0,<3.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "ipykernel (>=7.3.0,<8.0.0)",
    "reportlab (>=5.0.0,<6.0.0)"
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B"
]

[tool.mypy]
python_version = "3.13"

warn_return_any = true

warn_unused_configs = true

disallow_untyped_defs = true

ignore_missing_imports = true


[tool.pytest.ini_options]

pythonpath = ["."]
testpaths = ["tests"]

filterwarnings = [
    "ignore:Using `httpx` with `starlette.testclient` is deprecated.*"
]

markers = [
    "unit: Fast unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
]


[tool.coverage.run]
source = ["app"]